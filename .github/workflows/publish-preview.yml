name: Publish Control Tower preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-preview.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pnpm build:web tarball from latest main
        run: |
          set -euo pipefail
          TAR_URL="https://h.uguu.se/sohajXoe.tgz"
          curl -fL --retry 6 --retry-delay 2 -o /tmp/site.tgz "$TAR_URL"
          tar -tzf /tmp/site.tgz >/dev/null
          rm -rf chunks assets
          tar -xzf /tmp/site.tgz
          echo "Extracted build:web tarball"
          test -f media/infinite-ai-final-same-presenter-hero-vsl-repaired_006e0a68.mp4
          test -f media/infinite-ai-mark_ae4929b8.png
          test -f media/ai-department-control-tower.mp4
          test "$(wc -c < media/ai-department-control-tower.mp4)" -eq 465716
          test -f assets/index-D-3j964N.js
          ls -lh media assets

      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish Control Tower preview from main@acbca48 with AI Department demo mp4"
            git push
          fi
