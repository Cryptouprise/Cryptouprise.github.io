<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f05a1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>DoorBoss</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* ============================================================
   DoorBoss — field canvassing for ESR / Solar Freedom
   Layout: one-screen app. Map fills the viewport, bottom tab bar,
   slide-up property sheet. Manager tools live under Team.
   ============================================================ */
:root{
  /* color */
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --fg:#121a22; --muted:#5a6773; --line:#d5dce2;
  --accent:#f05a1a; --accent-fg:#ffffff; --accent-soft:#fdeee6;
  --good:#15a35a; --warn:#e0a800; --bad:#d64545;
  --map-bg:#e6eaee; --map-line:#cdd5dc; --map-block:#f3f5f7;
  /* status */
  --s-unknocked:#7b8794; --s-not_home:#e0a800; --s-callback:#7c5cff; --s-interested:#2b7fff;
  --s-appointment:#15a35a; --s-signed:#0b7a68; --s-not_interested:#d64545; --s-do_not_knock:#3a434c;
  /* type */
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 8px 24px rgba(10,20,30,.14);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1419; --surface:#171f26; --surface-2:#1e2831; --fg:#e9eef2; --muted:#91a0ad; --line:#2a3640;
    --accent:#ff7a3d; --accent-fg:#161010; --accent-soft:#3a2418;
    --map-bg:#161d24; --map-line:#26313b; --map-block:#1c252e;
    --s-unknocked:#6b7884; --s-do_not_knock:#8a96a2;
    --shadow:0 8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#171f26; --surface-2:#1e2831; --fg:#e9eef2; --muted:#91a0ad; --line:#2a3640;
  --accent:#ff7a3d; --accent-fg:#161010; --accent-soft:#3a2418;
  --map-bg:#161d24; --map-line:#26313b; --map-block:#1c252e;
  --s-unknocked:#6b7884; --s-do_not_knock:#8a96a2;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---------- Leaflet essentials (1.9.4, trimmed; stylesheet cannot be loaded from CDN) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:var(--map-bg);font-family:var(--font-body);font-size:12px;line-height:1.4}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile::selection{background:transparent}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-zoom-animated{transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-div-icon{background:transparent;border:0}
@media (prefers-reduced-motion: reduce){.leaflet-zoom-anim .leaflet-zoom-animated{transition:none}}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}   /* the off-screen sheet (translateY 102%) must not give the page a scrollbar / rubber-band on phones */
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none}   /* app feel: no double-tap page zoom, no text selection on taps; the map keeps its own pinch */
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.02em}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.pill .led{width:8px;height:8px;border-radius:50%;background:var(--good)}
.pill.off .led{background:var(--warn)}
.pill.err .led{background:var(--bad)}
.role-badge{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- main / views ---------- */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.pad{padding-block:14px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view-map{overflow:hidden}
#map{position:absolute;inset:0}

/* map overlays */
.map-top{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:900;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.map-top>*{pointer-events:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .sw{width:9px;height:9px;border-radius:50%}
.map-fabs{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:900;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.fab.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.next-card{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:calc(70px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:900;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:10px}
.next-card .sw{width:12px;height:12px;border-radius:50%;flex:none}
.next-card .body{flex:1;min-width:0}
.next-card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-card .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-card .go{height:34px;padding:0 12px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;flex:none}
.map-note{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:54px;z-index:900;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
.draw-bar{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:10px;z-index:950;background:var(--fg);color:var(--bg);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.draw-bar .t{flex:1;font-weight:600;font-size:14px}
.draw-bar button{height:32px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.14);color:inherit;font-weight:600;font-size:13px}
.draw-bar button.ok{background:var(--accent);color:var(--accent-fg)}

/* rep / me markers */
.me-dot{width:18px;height:18px;border-radius:50%;background:#1e8cff;border:3px solid #fff;box-shadow:0 0 0 2px rgba(30,140,255,.4),0 2px 6px rgba(0,0,0,.3);position:relative}
.me-dot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(30,140,255,.5);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion: reduce){.me-dot::after{animation:none;opacity:.35}}
.rep-dot{width:28px;height:28px;border-radius:50%;color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.rep-dot.stale{opacity:.5}

/* ---------- tab bar ---------- */
.tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tab{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab .cnt{position:absolute;top:8px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* ---------- generic components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px;min-width:0}
.tile .v{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.tile .d{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.btn{height:44px;padding:0 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.status-chip.light{color:var(--fg);background:var(--surface-2);border:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.bad{background:var(--bad);color:#fff;border-color:transparent}
.tag.good{background:var(--good);color:#fff;border-color:transparent}
.tag.warn{background:var(--warn);color:#1b1500;border-color:transparent}
.tag.accent{background:var(--accent);color:var(--accent-fg);border-color:transparent}
input[type=text],input[type=search],input[type=datetime-local],input[type=date],input[type=number],select,textarea{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;display:grid;place-items:center;flex:none}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.sub-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tabs button{flex:none;height:34px;padding:0 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.sub-tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}   /* 8-column stats table swipes sideways on a phone instead of spilling off the card */
table.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
table.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl td.n,table.tbl th.n{text-align:right}
.tbl-wrap{overflow-x:auto;min-width:0}
.insight{display:flex;gap:10px;padding:12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
.insight .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:700;font-family:var(--font-display);font-size:16px}
.insight.warn .ic{background:var(--warn);color:#1b1500}
.insight.bad .ic{background:var(--bad);color:#fff}
.insight.good .ic{background:var(--good);color:#fff}
.insight.info .ic{background:var(--accent-soft);color:var(--accent)}
.insight .b{flex:1;min-width:0}
.insight .t{font-weight:600}
.insight .s{font-size:13px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-size:20px;margin-bottom:4px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- sheet ---------- */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:1200;opacity:0;transition:opacity .2s;pointer-events:none}
.backdrop.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);z-index:1300;transform:translateY(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.show{transform:translateY(0)}
@media (prefers-reduced-motion: reduce){.sheet,.backdrop{transition:none}}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px;flex:none}
.sheet .sc{overflow-y:auto;padding-block:6px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:22px;line-height:1.1}
.status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sbtn{height:58px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);padding:0 4px;text-align:center}
.sbtn .sw{width:14px;height:14px;border-radius:50%}
#saveKnock{position:sticky;bottom:0;z-index:2;box-shadow:0 -6px 14px var(--surface)}   /* phones: Save stays on screen after picking an outcome instead of hiding below the note/photos */
.sbtn.on{border-color:var(--fg);color:var(--fg);background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{color:var(--muted);font-weight:600}
.hist{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist .h{position:relative}
.hist .h::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:30px;padding:0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600}
.quick button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.brief{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.brief b{font-family:var(--font-display);font-size:15px}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:1400;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.4)}
.modal .box{width:min(520px,100%);max-height:90%;overflow-y:auto;background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:20px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ctx{position:absolute;z-index:1350;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;min-width:200px}
.ctx button{display:block;width:100%;text-align:left;padding:12px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.ctx button:last-child{border-bottom:0}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:13px;z-index:1500;opacity:0;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- v2: profile grid, appointments, coach ---------- */
.back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 6px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.grid-tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.grid-tbl th{position:sticky;top:0;background:var(--surface);text-align:right;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.grid-tbl th:first-child,.grid-tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.grid-tbl td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid-tbl tr.wk td{background:var(--surface-2);font-weight:700;border-top:2px solid var(--line)}
.grid-tbl tr.wk td:first-child{background:var(--surface-2)}
.grid-tbl td.dim{color:var(--muted)}
.grid-tbl td.hi{color:var(--good);font-weight:700}
.grid-tbl td.lo{color:var(--bad)}
.reason{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.reason:last-child{border-bottom:0}
.reason .n{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent);width:22px;flex:none;line-height:1.1}
.reason .b{flex:1;min-width:0}
.reason .t{font-weight:600}
.reason .s{font-size:13px;color:var(--muted)}
.reason .imp{font-family:var(--font-display);font-size:18px;font-weight:700;white-space:nowrap;color:var(--good)}
.appt-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.appt-card .when{font-family:var(--font-display);font-size:18px;font-weight:700}
.a-chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--muted)}
.a-chip.scheduled{background:var(--s-interested)}.a-chip.confirmed{background:var(--s-appointment)}.a-chip.held{background:var(--s-signed)}.a-chip.no_show{background:var(--bad)}.a-chip.rescheduled{background:var(--s-callback)}.a-chip.cancelled{background:var(--s-do_not_knock)}.a-chip.needs_outcome{background:var(--warn);color:#1b1500}
.coach{display:flex;flex-direction:column;gap:8px}
.coach .q{display:flex;gap:8px}
.coach .q input{flex:1}
.coach .a{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.coach .sugg{display:flex;gap:6px;flex-wrap:wrap}
.coach .sugg button{height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600}
.key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;font-size:13px;align-items:center}
.cmp .l{color:var(--muted)}
.cmp .v{font-family:var(--font-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.cmp .v.me{text-align:right}
.street-lbl{font-family:var(--font-body)}

@media (min-width:860px){
  .view.pad{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .wrap{max-width:960px;margin:0 auto}
  .sheet{left:auto;right:16px;bottom:16px;width:440px;max-height:calc(100% - 32px);border-radius:18px}
  .grid3{grid-template-columns:repeat(6,minmax(0,1fr))}
}

/* clusters at low zoom */
.cluster{border-radius:50%;background:var(--fg);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.3);font-family:var(--font-display);line-height:1}
.cluster b{font-size:15px;font-weight:700}
.cluster i{font-style:normal;font-size:8px;font-family:var(--font-body);opacity:.8;white-space:nowrap}
.photo-row{display:flex;gap:6px;flex-wrap:wrap}
.photo-row img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photo-row .add{width:64px;height:64px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:600;text-align:center;cursor:pointer}

/* ---------- design pass ---------- */
.topbar{box-shadow:0 1px 0 var(--line),0 4px 14px rgba(10,20,30,.05)}
.brand{letter-spacing:.03em}
.brand .dot{background:linear-gradient(135deg,var(--accent),#ffb13d)}
@media (max-width:440px){ .role-badge{display:none} .pill{padding:0 8px;font-size:11px;gap:5px} .brand{font-size:20px} .topbar{gap:6px} }
.tile{position:relative;overflow:hidden}
.tile .v{letter-spacing:-.01em}
.tile .l{font-weight:500}
.card h3{letter-spacing:.01em}
.item .t{letter-spacing:.005em}
.sbtn{transition:border-color .12s,background .12s,transform .08s}
.sbtn:active{transform:scale(.97)}
.sbtn.on{box-shadow:inset 0 0 0 1px var(--fg)}
.btn.primary{box-shadow:0 2px 8px rgba(240,90,26,.25)}
.chip.on{box-shadow:none}
.next-card{border-left:4px solid var(--accent)}
.sheet h2{letter-spacing:.005em}
.tag{letter-spacing:.06em}
.empty b{letter-spacing:.01em}
.grid-tbl td.hi{background:color-mix(in srgb,var(--good) 10%,transparent)}
.insight.good{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.insight.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.insight.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.seg button.on{font-weight:700}
.tabbar .tab.on svg{stroke-width:2.4}
.fab{transition:transform .08s}.fab:active{transform:scale(.94)}

/* ---------- production polish: next-door ring, pin labels, sign-in wall ---------- */
@keyframes nextPulse{0%{stroke-opacity:.95}50%{stroke-opacity:.3}100%{stroke-opacity:.95}}
.next-ring{animation:nextPulse 1.6s ease-in-out infinite}
.leaflet-tooltip{position:absolute;white-space:nowrap;pointer-events:none}
.leaflet-tooltip.pin-label{background:rgba(255,255,255,.9);border:0;border-radius:4px;padding:1px 4px;font:600 11px/1.2 var(--font-body);color:#1b2430;box-shadow:0 1px 2px rgba(0,0,0,.3)}
:root[data-theme="dark"] .leaflet-tooltip.pin-label{background:rgba(23,31,38,.9);color:#e9eef2}
.leaflet-tooltip.pin-label::before{display:none}
.authwall{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.authwall .box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.authwall .brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:22px}
.authwall .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.authwall h2{margin:4px 0 0;font-size:20px}.authwall p{margin:0;color:var(--muted)}.authwall .small{font-size:11px;word-break:break-all}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><span>DoorBoss</span></div>
    <span class="role-badge" id="roleBadge">Manager</span>
    <div class="spacer"></div>
    <button class="pill off" id="trackPill" title="Location tracking"><span class="led"></span><span id="trackText">GPS off</span></button>
    <button class="pill" id="syncPill" title="Sync status"><span class="led"></span><span id="syncText">Synced</span></button>
  </header>

  <main>
    <!-- DOORS -->
    <section class="view" id="view-map">
      <div id="map" aria-label="Territory map"></div>
      <div class="map-top">
        <div class="chips" id="filterChips"></div>
      </div>
      <div class="map-note" id="mapNote" hidden></div>
      <div class="draw-bar" id="drawBar" hidden>
        <span class="t" id="drawText">Tap the map to add corners</span>
        <button id="drawUndo">Undo</button>
        <button id="drawCancel">Cancel</button>
        <button class="ok" id="drawFinish">Finish</button>
      </div>
      <div class="map-fabs">
        <button class="fab" id="fabLocate" aria-label="Center on me"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
        <button class="fab" id="fabRoute" aria-label="Plan a route"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h5a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg></button>
        <button class="fab primary" id="fabAdd" aria-label="Add a house at my position"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="next-card" id="nextCard" hidden>
        <span class="sw" id="nextSw"></span>
        <div class="body"><div class="t" id="nextT"></div><div class="s" id="nextS"></div></div>
        <button class="go" id="nextGo">Open</button>
      </div>
    </section>

    <!-- FOLLOW-UPS -->
    <section class="view pad" id="view-follow" hidden><div class="wrap" id="followWrap"></div></section>

    <!-- TEAM -->
    <section class="view pad" id="view-team" hidden><div class="wrap" id="teamWrap"></div></section>

    <!-- ME -->
    <section class="view pad" id="view-me" hidden><div class="wrap" id="meWrap"></div></section>

    <!-- REP PROFILE (reached from leaderboard, live, or Me) -->
    <section class="view pad" id="view-rep" hidden><div class="wrap" id="repWrap"></div></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-view="map"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>Doors</button>
    <button class="tab" data-view="follow"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>Follow-ups<span class="cnt" id="followCnt" hidden></span></button>
    <button class="tab" data-view="team" id="tabTeam"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M14.5 20a4.5 4.5 0 0 1 7 0"/></svg>Team</button>
    <button class="tab" data-view="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div class="sc" id="sheetBody"></div></div>
  <div class="ctx" id="ctx" hidden></div>
  <div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>
  <div class="toast" id="toast"></div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  appName: 'DoorBoss',
  demoCenter: [39.6975, -104.8262],          // Aurora, CO
  // Streets: Esri World Street Map — clean, keyless, built for app traffic, same host as the satellite layer. (OSM's own tile server blocks apps at team scale.)
  tiles: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  tilesAttribution: '© Esri, HERE, Garmin, OpenStreetMap contributors',
  tilesFallback: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',                        // only if the host blocks arcgisonline
  mapboxStreets: 'https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/256/{z}/{x}/{y}?access_token={token}',   // used instead when mapboxToken is set
  // Satellite: Esri World Imagery needs no key (attribution required). Set mapboxToken for Mapbox Satellite Streets (sharper, labels on top, 50k loads/mo free).
  satTiles: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  satAttribution: 'Imagery © Esri, Maxar, Earthstar Geographics',
  mapboxToken: '',
  mapboxSat: 'https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/tiles/256/{z}/{x}/{y}?access_token={token}',
  defaultBasemap: 'streets',                   // 'streets' | 'satellite' — reps usually flip to satellite once they're on a street
  apiBase: '/api',                            // production data layer reads this; set to 'https://portal.example.com/api' when the app is hosted elsewhere
  vapidPublicKey: '',                        // set from the backend (AI-STUDIO-BUILD stage 11) to enable real push
  noServiceWorker: false,                     // the shared preview sets this automatically when registration fails
  heartbeatMs: 20000,
  teamPollMs: 10000,
  queueFlushMs: 30000,
  staleRepMs: 3 * 60 * 1000,
  reknockDays: 3,                              // "not home" becomes knockable again after N days
  onlineWindowMs: 2 * 60 * 1000,
  textTemplates: [
    { id:'intro',    label:'Intro',    body:'Hi {first}, this is {rep} with Elite Solar Recovery. We stopped by about the solar system {installer} put on your home. Since they shut down, you may have options on that contract. Good time to talk today?' },
    { id:'callback', label:'Callback', body:'Hi {first}, {rep} from Elite Solar Recovery. Following up like we said. Does {when} still work?' },
    { id:'confirm',  label:'Confirm appt', body:'Hi {first}, confirming your appointment with Elite Solar Recovery on {when}. Reply YES to confirm or let me know if you need a different time.' }
  ]
};

const STATUSES = [
  { id:'unknocked',      label:'Not knocked',    color:'var(--s-unknocked)',      contact:false },
  { id:'not_home',       label:'Not home',       color:'var(--s-not_home)',       contact:false },
  { id:'callback',       label:'Callback',       color:'var(--s-callback)',       contact:true  },
  { id:'interested',     label:'Interested',     color:'var(--s-interested)',     contact:true  },
  { id:'appointment',    label:'Appt set',       color:'var(--s-appointment)',    contact:true  },
  { id:'signed',         label:'Signed',         color:'var(--s-signed)',         contact:true  },
  { id:'not_interested', label:'Not interested', color:'var(--s-not_interested)', contact:true  },
  { id:'do_not_knock',   label:'Do not knock',   color:'var(--s-do_not_knock)',   contact:false }
];
const S = Object.fromEntries(STATUSES.map(s => [s.id, s]));
const KNOCKABLE = ['unknocked','not_home','callback','interested'];
const TIERS = {
  verified_installed:   { label:'Panels on roof',  short:'Installed',   note:'Installer gone. Warranty and service are the opener.' },
  verified_uninstalled: { label:'Permit, no panels', short:'Uninstalled', note:'They signed and never got panels. Highest intent.' },
  permit_only:          { label:'Permit on file',   short:'Permit',      note:'Not yet verified from the air. Confirm at the door.' },
  none:                 { label:'No permit data',   short:'—',           note:'' }
};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const DAY = 86400000;
const now = () => Date.now();
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const dayKey = t => { const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const fmtDate = t => new Date(t).toLocaleDateString([], {month:'short', day:'numeric'});
const fmtDT = t => fmtDate(t) + ' ' + fmtTime(t);
const fmtRel = t => { const d = now()-t; if (d < 60000) return 'just now'; if (d < 3600000) return Math.round(d/60000)+'m ago'; if (d < DAY) return Math.round(d/3600000)+'h ago'; return Math.round(d/DAY)+'d ago'; };
const fmtDist = m => m < 1000 ? Math.round(m)+' m' : (m/1609.34).toFixed(1)+' mi';
const pct = (a,b) => b ? Math.round(100*a/b)+'%' : '—';
const ratio = (a,b) => b ? (a/b).toFixed(1) : '—';
const firstName = n => (n||'').split(' ')[0] || 'there';
const toLocalInput = t => { const d = new Date(t); const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); };

function haversine(a, b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLng=toR(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function pointInPoly(pt, poly){ // pt [lat,lng], poly [[lat,lng],...]
  let inside=false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++){
    const yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    const intersect = ((yi>pt[0]) !== (yj>pt[0])) && (pt[1] < (xj-xi)*(pt[0]-yi)/(yj-yi)+xi);
    if (intersect) inside=!inside;
  }
  return inside;
}
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function csvParse(text){
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(cur); cur=''; }
    else if (c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if (c==='\r'){ }
    else cur+=c;
  }
  if (cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.length>1 || (r[0]||'').trim());
}
function csvStringify(rows){ return rows.map(r => r.map(v => { const s=String(v ?? ''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n'); }

/* ============================================================
   SEED DATA (demo only) — Aurora, CO orphaned-permit list
   ============================================================ */
function seedDemo(){
  const rnd = mulberry32(20261014);

  const installers = [
    ['Titan Solar Power','2024'],['Freedom Forever','2026'],['SunPower','2024'],['Solcius','2025'],

  const finance = ['GoodLeap','Mosaic','Sunlight Financial','Dividend','Sunnova','EnFin','Service Finance'];
  const first = ['Maria','James','Linda','Robert','Patricia','Michael','Jennifer','David','Elizabeth','William','Susan','Joseph','Karen','Thomas','Nancy','Daniel','Lisa','Carlos','Angela','Kevin','Rosa','Brian','Diana','Luis','Amanda','Mark','Teresa','Jason','Sandra','Eric'];
  const last = ['Garcia','Johnson','Martinez','Smith','Hernandez','Brown','Lopez','Davis','Gonzalez','Miller','Rodriguez','Wilson','Nguyen','Anderson','Torres','Thomas','Ramirez','Moore','Flores','Jackson','Chavez','White','Harris','Sanchez','Clark'];

  const users = [
    { id:'u1', name:'Chase F.',  role:'manager', color:'#f05a1a', team_id:'t1', phone:'(720) 555-0100' },
    { id:'u2', name:'Marcus R.', role:'rep',     color:'#2b7fff', team_id:'t1', phone:'(720) 555-0101' },
    { id:'u3', name:'Dani O.',   role:'rep',     color:'#15a35a', team_id:'t1', phone:'(720) 555-0102' },
    { id:'u4', name:'Jordan K.', role:'rep',     color:'#7c5cff', team_id:'t1', phone:'(720) 555-0103' },
    { id:'u5', name:'Tay M.',    role:'rep',     color:'#e0a800', team_id:'t1', phone:'(720) 555-0104' }
  ];

  // 4 territories, each a block of E-W streets east of S Chambers Rd (~120 doors each)
  const blocks = [
    { id:'tr1', name:'Jewell–Iliff',      color:'#2b7fff', lat0:39.6905, lng0:-104.8290, streets:['E Jewell Ave','E Asbury Ave','E Evans Ave','E Warren Ave','E Iliff Ave','E Wesley Ave','E Harvard Ave','E Vassar Ave','E Yale Ave','E Amherst Ave','E Bates Ave','E Cornell Ave','E Dartmouth Ave','E Eastman Ave'], reps:['u2','u3'] },
    { id:'tr2', name:'Dartmouth–Cornell', color:'#15a35a', lat0:39.6905, lng0:-104.8140, streets:['E Dartmouth Ave','E Cornell Ave','E Bates Ave','E Eastman Ave','E Floyd Ave','E Girard Ave','E Hampden Ave','E Jefferson Ave','E Kenyon Ave','E Lehigh Ave','E Mansfield Ave','E Nassau Ave','E Oxford Ave','E Princeton Ave'], reps:['u4'] },
    { id:'tr3', name:'Mississippi North', color:'#7c5cff', lat0:39.7085, lng0:-104.8290, streets:['E Mississippi Ave','E Arizona Ave','E Louisiana Ave','E Tennessee Ave','E Kentucky Ave','E Ohio Ave','E Exposition Ave','E Virginia Ave','E Cedar Ave','E Bayaud Ave','E Center Ave','E Ellsworth Ave','E Archer Pl','E Alameda Ave'], reps:['u5'] },
    { id:'tr4', name:'Alameda East',      color:'#e0a800', lat0:39.7085, lng0:-104.8140, streets:['E 1st Ave','E 2nd Ave','E 3rd Ave','E 4th Ave','E 5th Ave','E 6th Ave','E 7th Ave','E 8th Ave','E 9th Ave','E 10th Ave','E 11th Ave','E 12th Ave','E 13th Ave','E 14th Ave'], reps:[] }
  ];
  const properties = [], territories = [];
  const dLat = 0.00115, dLng = 0.00040, perStreet = 14;
  for (const b of blocks){
    const n = b.streets.length;
    const poly = [[b.lat0-0.0005, b.lng0-0.0005],[b.lat0-0.0005, b.lng0+dLng*(perStreet-1)+0.0006],[b.lat0+dLat*(n-1)+0.0006, b.lng0+dLng*(perStreet-1)+0.0006],[b.lat0+dLat*(n-1)+0.0006, b.lng0-0.0005]];
    territories.push({ id:b.id, name:b.name, color:b.color, polygon:poly, assigned_user_ids:b.reps.slice(), team_id:'t1', reknock_days:CONFIG.reknockDays, created_at: now()-20*DAY });
    b.streets.forEach((street, si) => {
      for (let h=0; h<perStreet; h++){
        const side = h%2 ? 1 : -1;
        const lat = b.lat0 + si*dLat + side*0.00016 + (rnd()-0.5)*0.00004;
        const lng = b.lng0 + h*dLng + (rnd()-0.5)*0.00008;
        const num = 15400 + Math.round((lng+104.8300)/0.00042)*4 + (h%2);
        const inst = pick(installers);
        const r = rnd();
        const tier = r < 0.62 ? 'verified_installed' : r < 0.9 ? 'verified_uninstalled' : 'permit_only';
        const fn = pick(first), ln = pick(last);
        properties.push({
          id:'p'+(properties.length+1), lat, lng,
          address:`${num} ${street}`, city:'Aurora', state:'CO', zip: b.lat0>39.699 ? '80012' : '80014',
          owner_name:`${fn} ${ln}`, owner_phone:`(720) 555-${String(1000+Math.floor(rnd()*9000))}`,
          owner_email:`${fn}.${ln}@example.com`.toLowerCase(),
          installer:inst[0], installer_status:'bankrupt', installer_closed:inst[1],
          tier, permit_year: String(2018+Math.floor(rnd()*7)), system_kw:(5+rnd()*7).toFixed(1), finance_co:pick(finance),
          source:'Scout Data · Freedom Forever ledger', territory_id:b.id,
          status:'unknocked', last_knock_at:null, last_knock_by:null, callback_at:null, appointment_at:null,
          ghl_contact_id:null, ghl_opportunity_id:null, created_at: now()-20*DAY
        });
      }
    });
  }

  // 14 days of knocks. Each rep has a work pattern so the gap engine has something true to find.
  //   start = usual first knock (hour), hours = usual day length, evening = share of doors pushed after 4 pm, pitch = appointment skill multiplier
  const profile = { u2:{ start:8.75, hours:9.0, evening:0.40, pitch:1.25, off:0.06 },   // Marcus: early, long days, evening-heavy
                    u3:{ start:10.5, hours:7.5, evening:0.30, pitch:1.00, off:0.12 },   // Dani: solid
                    u4:{ start:11.5, hours:6.0, evening:0.20, pitch:1.15, off:0.15 },   // Jordan: late start, short days, decent pitch
                    u5:{ start:10.0, hours:8.0, evening:0.40, pitch:0.75, off:0.10 } }; // Tay: volume, weak close
  const knocks = [], appointments = [];
  const outcome = (h, pitch) => { const nh = h>=16 ? 0.56 : h<=12 ? 0.76 : 0.68; const r=rnd(); if (r<nh) return 'not_home'; const c=(r-nh)/(1-nh); const ap = 0.10*pitch; if (c<0.44) return 'not_interested'; if (c<0.68) return 'callback'; if (c<0.87-ap) return 'interested'; if (c<0.985) return 'appointment'; return 'signed'; };
  const byTerr = {}; properties.forEach(p => (byTerr[p.territory_id] ||= []).push(p));
  const repTerr = { u2:'tr1', u3:'tr1', u4:'tr2', u5:'tr3' };
  const knockableAt = (p, t) => p.status==='unknocked' || p.status==='interested' || p.status==='callback' || p.status==='appointment' || (p.status==='not_home' && (!p.last_knock_at || t-p.last_knock_at > CONFIG.reknockDays*DAY));
  const settleAppointment = (ap, t) => { // past appointments get an outcome
    const r = rnd();
    if (r<0.12){ ap.status='no_show'; } else if (r<0.20){ ap.status='scheduled'; ap.at = t + 2*DAY; ap.note = (ap.note?ap.note+' · ':'')+'rescheduled'; } else if (r<0.24){ ap.status='cancelled'; }
    else { ap.status='held'; ap.result = rnd()<0.5 ? 'signed' : rnd()<0.6 ? 'follow_up' : 'lost'; }
    ap.updated_at = ap.at + 3600000;
  };
  for (let d=14; d>=0; d--){
    const dayStart = startOfDay(now()-d*DAY);
    const dow = new Date(dayStart).getDay();
    if (dow===0) continue;
    for (const rep of ['u2','u3','u4','u5']){
      const pf = profile[rep];
      if (rnd()<pf.off) continue; // day off
      const terr = byTerr[repTerr[rep]];
      const start = pf.start + (rnd()-0.5)*1.0, hours = pf.hours + (rnd()-0.5)*1.5;
      const n = d===0 ? 8+Math.floor(rnd()*10) : Math.round(hours*3.2 + rnd()*8);
      for (let i=0;i<n;i++){
        let hr = rnd()<pf.evening ? 16+rnd()*4 : start + rnd()*Math.max(1, Math.min(hours, 20-start));
        hr = Math.min(20.9, Math.max(start, hr));
        const t = dayStart + Math.floor(hr*3600000);
        if (d===0 && t>now()) continue;
        // follow-ups first (callbacks due, appointments, interested), then fresh doors
        const due = terr.filter(p => (p.status==='callback' && p.callback_at && p.callback_at <= t) || p.status==='appointment' && p.appointment_at && p.appointment_at <= t || (p.status==='interested' && t-p.last_knock_at > DAY));
        const fresh = terr.filter(p => knockableAt(p,t) && p.status!=='callback' && p.status!=='appointment' && p.status!=='interested');
        let p = (due.length && rnd()<0.3) ? pick(due) : (fresh.length ? pick(fresh) : (due.length ? pick(due) : null));
        if (!p) break;
        let st = outcome(new Date(t).getHours(), pf.pitch);
        if (p.status==='callback') st = rnd()<0.40*pf.pitch ? 'appointment' : rnd()<0.5 ? 'not_home' : 'callback';
        if (p.status==='interested') st = rnd()<0.50*pf.pitch ? 'appointment' : rnd()<0.5 ? 'callback' : 'not_home';
        if (p.status==='appointment') { // door already has an open appointment; a re-knock is a confirmation visit
          if (p.appointment_at && p.appointment_at > t) continue;
          st = rnd()<0.5 ? 'callback' : 'not_interested';
        }
        const k = { id:uid(), client_id:uid(), property_id:p.id, user_id:rep, status:st, note:'', source:'door', lat:p.lat+(rnd()-0.5)*0.0001, lng:p.lng+(rnd()-0.5)*0.0001, accuracy_m:Math.round(5+rnd()*20), callback_at:null, appointment_at:null, created_at:t, synced_at:t+2000 };
        if (st==='callback'){ k.callback_at = startOfDay(t) + (1+Math.floor(rnd()*4))*DAY + (16+Math.floor(rnd()*4))*3600000; k.note = pick(['Talk to spouse first','Call after 5','Wants the warranty letter','Asked for the bankruptcy notice','Back Thursday']); }
        if (st==='appointment'){ k.appointment_at = startOfDay(t) + (1+Math.floor(rnd()*5))*DAY + (10+Math.floor(rnd()*9))*3600000; k.note = pick(['Both owners home','Bring the loan statement','Kitchen table, 30 min','They have the install photos']); }
        if (st==='interested') k.note = pick(['Paying two bills, wants out','Panels never turned on','Inverter dead since spring','Asked what we charge']);
        if (st==='signed') k.note = 'Signed intake. Docs uploaded.';
        knocks.push(k);
        p.status = st; p.last_knock_at = t; p.last_knock_by = rep;
        if (st==='callback') p.callback_at = k.callback_at;
        if (st==='appointment'){
          p.appointment_at = k.appointment_at;
          const ap = { id:'a'+uid(), property_id:p.id, knock_id:k.id, user_id:rep, at:k.appointment_at, status: rnd()<0.6?'confirmed':'scheduled', result:null, note:k.note, ghl_event_id:'demo_evt_'+appointments.length, created_at:t, updated_at:t };
          appointments.push(ap); p.appointment_id = ap.id;
        }
        if (st==='signed') p.appointment_at = null;
      }
    }
  }
  // settle every appointment whose time has passed; held+signed flips the door to signed
  for (const ap of appointments){
    if (ap.at >= now()) continue;
    settleAppointment(ap, ap.at);
    const p = properties.find(x => x.id===ap.property_id);
    if (!p) continue;
    if (ap.status==='held' && ap.result==='signed'){ p.status='signed'; p.appointment_at=null;  knocks.push({ id:uid(), client_id:uid(), property_id:p.id, user_id:ap.user_id, status:'signed', note:'Signed at appointment', source:'portal', lat:null, lng:null, accuracy_m:null, callback_at:null, appointment_at:null, created_at:ap.updated_at, synced_at:ap.updated_at+2000 }); p.last_knock_at=ap.updated_at; }
    else if (ap.status==='held' && ap.result==='lost'){ if (p.status==='appointment'){ p.status='not_interested'; p.appointment_at=null;  } }
    else if (ap.status==='held' && ap.result==='follow_up'){ if (p.status==='appointment'){ p.status='callback'; p.callback_at=ap.updated_at+3*DAY; p.appointment_at=null;  } }
    else if (ap.status==='no_show'){ if (p.status==='appointment'){ p.status='callback'; p.callback_at=startOfDay(ap.at)+DAY+17*3600000; p.appointment_at=null;  } }
    else if (ap.status==='scheduled'){ p.appointment_at=ap.at; if (p.status!=='signed') p.status='appointment'; }
    else if (ap.status==='cancelled'){ if (p.status==='appointment'){ p.status='not_interested'; p.appointment_at=null;  } }
  }
  knocks.sort((a,b)=>a.created_at-b.created_at);
  const positions = {};
  for (const rep of ['u2','u3','u4','u5']){ const pool=byTerr[repTerr[rep]]; const p=pick(pool); positions[rep]={ user_id:rep, lat:p.lat, lng:p.lng, updated_at: now()-Math.floor(rnd()*4*60000) }; }
  positions.u3.updated_at = now()-25*60000; // one stale rep for the demo
  return { v:2, meId:'u1', users, properties, knocks, appointments, territories, positions, messages:[], queue:[],
    goals:{ daily_knocks:60, daily_contacts:20, daily_appts:2 },
    settings:{ heartbeat:true, ai:{ provider:'company', key:'' }, apiKeys:[], webhooks:[] }, created_at: now() };
}

CONFIG.demo = true;   // sample data: the map opens on the demo neighbourhood instead of fitting the list
const DB = (() => {
  const KEY = 'doorboss.v1';
  let st = null;
  function load(){ try { const raw = localStorage.getItem(KEY); if (raw) st = JSON.parse(raw); } catch(e){ st=null; } if (!st || st.v!==2) { st = seedDemo(); save(); } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
  const prop = id => st.properties.find(p => p.id===id);
  return {
    init(){ load(); return Promise.resolve(); },
    reset(){ st = seedDemo(); save(); return Promise.resolve(); },
    async currentUser(){ return st.users.find(u => u.id===st.meId); },
    async setCurrentUser(id){ st.meId=id; save(); },
    async listUsers(){ return st.users; },
    async saveUser(u){ u.id = u.id || 'u'+uid(); const i = st.users.findIndex(x=>x.id===u.id); if (i>=0) st.users[i]=Object.assign(st.users[i], u); else st.users.push(Object.assign({ role:'rep', team_id:'t1', color:'#2b7fff', active:true }, u)); save(); return u; },
    async savePushSubscription(sub){ st.settings.push = { endpoint:sub.endpoint, at:now() }; save(); },
    async listProperties(){ return st.properties; },
    async getProperty(id){ return prop(id); },
    async upsertProperties(list){
      let added=0, updated=0;
      for (const p of list){
        const ex = st.properties.find(x => x.id===p.id || (x.address && p.address && x.address.toLowerCase()===p.address.toLowerCase() && x.zip===p.zip));
        if (ex){ Object.assign(ex, p, { id:ex.id, status:ex.status }); updated++; }
        else { st.properties.push(Object.assign({ id:'p'+uid(), status:'unknocked', last_knock_at:null, callback_at:null, appointment_at:null, created_at:now() }, p)); added++; }
      }
      // assign territories
      for (const p of st.properties){ if (!p.territory_id){ const t = st.territories.find(t => pointInPoly([p.lat,p.lng], t.polygon)); if (t) p.territory_id=t.id; } }
      save(); return { added, updated };
    },
    async addKnock(k){
      k.id = k.id || uid(); k.client_id = k.client_id || uid(); k.created_at = k.created_at || now(); k.synced_at = null; k.source = k.source || 'door';
      st.knocks.push(k);
      const p = prop(k.property_id);
      if (p){
        p.status=k.status; p.last_knock_at=k.created_at; p.last_knock_by=k.user_id;
        p.callback_at = k.status==='callback' ? k.callback_at : null;
        if (k.status==='appointment'){
          p.appointment_at = k.appointment_at;
          const ap = { id:'a'+uid(), property_id:p.id, knock_id:k.id, user_id:k.user_id, at:k.appointment_at, status:'scheduled', result:null, note:k.note||'', ghl_event_id:null, created_at:now(), updated_at:now() };
          st.appointments.push(ap); p.appointment_id = ap.id; st.queue.push({ type:'appointment', id:ap.id, at:now() });
        } else if (k.status==='signed'){
          const ap = st.appointments.find(a => a.id===p.appointment_id); if (ap && (ap.status==='scheduled'||ap.status==='confirmed')){ ap.status='held'; ap.result='signed'; ap.updated_at=now(); st.queue.push({ type:'appointment', id:ap.id, at:now() }); }
          p.appointment_at = null; 
        }
      }
      st.queue.push({ type:'knock', id:k.id, at:now() });
      save(); return k;
    },
    async listKnocks(){ return st.knocks; },
    async listAppointments(){ return st.appointments; },
    async updateAppointment(id, patch){
      const ap = st.appointments.find(a => a.id===id); if (!ap) return null;
      Object.assign(ap, patch, { updated_at: now() });
      const p = prop(ap.property_id);
      if (p){
        if (ap.status==='rescheduled' && patch.at){ p.appointment_at = ap.at; p.status='appointment'; ap.status='scheduled'; }
        if (ap.status==='no_show'){ p.appointment_at=null;  p.status='callback'; p.callback_at = startOfDay(now())+DAY+17*3600000; st.knocks.push({ id:uid(), client_id:uid(), property_id:p.id, user_id:ap.user_id, status:'callback', note:'No-show · re-book', source:'portal', callback_at:p.callback_at, appointment_at:null, created_at:now(), synced_at:null }); }
        if (ap.status==='cancelled'){ p.appointment_at=null;  if (p.status==='appointment') p.status='not_interested'; }
        if (ap.status==='held'){
          if (ap.result==='signed'){ p.status='signed'; p.appointment_at=null;  st.knocks.push({ id:uid(), client_id:uid(), property_id:p.id, user_id:ap.user_id, status:'signed', note:'Signed at appointment', source:'portal', callback_at:null, appointment_at:null, created_at:now(), synced_at:null }); p.last_knock_at=now(); }
          if (ap.result==='lost'){ p.status='not_interested'; p.appointment_at=null;  }
          if (ap.result==='follow_up'){ p.status='callback'; p.callback_at=now()+3*DAY; p.appointment_at=null;  }
        }
      }
      st.queue.push({ type:'appointment', id:ap.id, at:now() });
      save(); return ap;
    },
    async claimTerritory(id, userId){ const t = st.territories.find(x => x.id===id); if (!t) return; t.assigned_user_ids = t.assigned_user_ids||[]; if (!t.assigned_user_ids.includes(userId)) t.assigned_user_ids.push(userId); save(); return t; },
    async getAiSettings(){ return st.settings.ai || { provider:'company', key:'' }; },
    async setAiSettings(ai){ st.settings.ai = ai; save(); },
    async listApiKeys(){ return st.settings.apiKeys || []; },
    async createApiKey(label){ const k = { id:uid(), label, key:'db_live_'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10), created_at:now() }; (st.settings.apiKeys ||= []).push(k); save(); return k; },
    async revokeApiKey(id){ st.settings.apiKeys = (st.settings.apiKeys||[]).filter(k => k.id!==id); save(); },
    async listWebhooks(){ return st.settings.webhooks || []; },
    async saveWebhook(w){ w.id = w.id || uid(); const arr = (st.settings.webhooks ||= []); const i = arr.findIndex(x => x.id===w.id); if (i>=0) arr[i]=w; else arr.push(w); save(); return w; },
    async deleteWebhook(id){ st.settings.webhooks = (st.settings.webhooks||[]).filter(w => w.id!==id); save(); },
    async listTerritories(){ return st.territories; },
    async saveTerritory(t){
      t.id = t.id || 'tr'+uid(); t.created_at = t.created_at || now();
      const i = st.territories.findIndex(x => x.id===t.id); if (i>=0) st.territories[i]=t; else st.territories.push(t);
      for (const p of st.properties){ if (pointInPoly([p.lat,p.lng], t.polygon)) p.territory_id = t.id; }
      save(); return t;
    },
    async deleteTerritory(id){ st.territories = st.territories.filter(t => t.id!==id); st.properties.forEach(p => { if (p.territory_id===id) p.territory_id=null; }); save(); },
    async heartbeat(pos){ const trail = pos.trail||[]; delete pos.trail; st.positions[st.meId] = Object.assign({ user_id:st.meId }, pos, { updated_at: now() }); (st.position_history ||= []).push(...trail.map(t=>Object.assign({ user_id:st.meId }, t))); if (st.position_history.length>5000) st.position_history = st.position_history.slice(-5000); save(); },
    async listPositionHistory(user_id, dayT){
      const d0=startOfDay(dayT), d1=d0+DAY;
      let pts = (st.position_history||[]).filter(x=>x.user_id===user_id && x.at>=d0 && x.at<d1);
      if (!pts.length){ // demo: rebuild a trail from that day's knocks
        pts = st.knocks.filter(k=>k.user_id===user_id && k.created_at>=d0 && k.created_at<d1 && k.lat!=null).sort((a,b)=>a.created_at-b.created_at).map(k=>({ user_id, lat:k.lat, lng:k.lng, at:k.created_at, acc:k.accuracy_m }));
        const cur = st.positions[user_id]; if (cur && cur.updated_at>=d0 && cur.updated_at<d1) pts.push({ user_id, lat:cur.lat, lng:cur.lng, at:cur.updated_at, acc:cur.accuracy_m });
      }
      return pts.sort((a,b)=>a.at-b.at);
    },
    async listPositions(){
      // demo: other reps drift a little so the live view moves
      for (const id in st.positions){ if (id!==st.meId && now()-st.positions[id].updated_at < CONFIG.staleRepMs){ const p=st.positions[id]; p.lat += (Math.random()-0.5)*0.00012; p.lng += (Math.random()-0.5)*0.00016; p.updated_at = now(); } }
      return Object.values(st.positions);
    },
    async sendMessage(m){ m.id=uid(); m.created_at=now(); m.ghl_message_id=null; st.messages.push(m); st.queue.push({ type:'message', id:m.id, at:now() }); save(); return m; },
    async listMessages(property_id){ return st.messages.filter(m => m.property_id===property_id); },
    async flushQueue(){
      // demo: pretend the backend accepted everything
      const n = st.queue.length; const t = now();
      for (const q of st.queue){ if (q.type==='knock'){ const k=st.knocks.find(x=>x.id===q.id); if (k) k.synced_at=t; } if (q.type==='message'){ const m=st.messages.find(x=>x.id===q.id); if (m) m.ghl_message_id='demo_'+m.id; } if (q.type==='appointment'){ const a=st.appointments.find(x=>x.id===q.id); if (a && !a.ghl_event_id) a.ghl_event_id='demo_evt_'+a.id; } }
      st.queue = []; save(); return n;
    },
    async queueLength(){ return st.queue.length; },
    async getGoals(){ return st.goals; },
    async setGoals(g){ st.goals = g; save(); },
    async getSettings(){ return st.settings; },
    async setSettings(s){ st.settings = s; save(); },
    async aiBrief(property){
      // demo: deterministic brief. Production: POST /api/ai/brief → Assistable / GHL agent / Claude.
      const tier = TIERS[property.tier] || TIERS.none;
      const lines = [];
      lines.push(`Open with the fact: ${property.installer} shut down in ${property.installer_closed || 'the last two years'}. They own a ${property.system_kw || '~7'} kW permit from ${property.permit_year}${property.finance_co ? ', financed through '+property.finance_co : ''}.`);
      if (property.tier==='verified_uninstalled') lines.push('Panels were never installed. Ask: "Are you still making payments on a system that was never turned on?" That is the whole pitch.');
      else if (property.tier==='verified_installed') lines.push('Panels are on the roof. Ask who they call when it breaks, and whether the bill actually went down. Two bills is the trigger.');
      else lines.push('Permit on file, not aerial-verified. Ask whether it was ever installed before anything else.');
      lines.push('Close on a 20-minute review of the contract, not on "cancel your solar." Book it on the spot.');
      return { headline: tier.label + ' · ' + property.installer, lines };
    }
  };
})();

/* ============================================================
   ROUTE — plan the day's doors from where the rep is standing
   Nearest-neighbour seed, then 2-opt until no improvement. 100 doors plans in well under 50 ms on a phone.
   Callbacks due go first in time order; the rest are walked in distance order.
   ============================================================ */
function planRoute(start, props, opts={}){
  const due = props.filter(p => p.status==='callback' && p.callback_at && p.callback_at <= now()+2*3600000).sort((a,b)=>a.callback_at-b.callback_at);
  const rest = props.filter(p => !due.includes(p));
  const d = (a,b) => haversine(a,b);
  // nearest neighbour over `rest`
  let cur = due.length ? [due[due.length-1].lat, due[due.length-1].lng] : start;
  const left = rest.slice(); const order = [];
  while (left.length){ let bi=0, bd=Infinity; for (let i=0;i<left.length;i++){ const dd=d(cur,[left[i].lat,left[i].lng]); if (dd<bd){ bd=dd; bi=i; } } const p=left.splice(bi,1)[0]; order.push(p); cur=[p.lat,p.lng]; }
  // 2-opt
  const pts = order.map(p=>[p.lat,p.lng]); const n=pts.length;
  if (n>3 && !opts.noOpt){
    const anchor = due.length ? [due[due.length-1].lat, due[due.length-1].lng] : start;
    const tourLen = (arr) => { let t=d(anchor,arr[0]); for (let i=1;i<arr.length;i++) t+=d(arr[i-1],arr[i]); return t; };
    let improved=true, passes=0;
    while (improved && passes<25){ improved=false; passes++;
      for (let i=0;i<n-2;i++) for (let k=i+1;k<n-1;k++){
        const a=i?pts[i-1]:anchor, b=pts[i], c=pts[k], e=pts[k+1];
        if (d(a,b)+d(c,e) > d(a,c)+d(b,e)+0.5){ pts.splice(i, k-i+1, ...pts.slice(i,k+1).reverse()); order.splice(i, k-i+1, ...order.slice(i,k+1).reverse()); improved=true; }
      }
    }
  }
  const out=[]; let prev=start;
  for (const p of due.concat(order)){ const ll=[p.lat,p.lng]; out.push({ p, leg:d(prev,ll), due:due.includes(p) }); prev=ll; }
  return out;
}
function routeCandidates(){
  const inTerr = isMgr() && !A.mine ? A.props : A.props.filter(inMyTerr);
  return inTerr.filter(p => p.status!=='do_not_knock' && (isKnockable(p)));
}
function startRoute(){
  if (!A.myPos) return toast('No position yet');
  const cand = routeCandidates(); if (!cand.length) return toast('No knockable doors in your territory');
  const cap = Math.min(cand.length, 120);
  // take the closest N first so the plan stays walkable, then optimise
  const near = cand.map(p=>({p, d:haversine(A.myPos,[p.lat,p.lng])})).sort((a,b)=>a.d-b.d).slice(0,cap).map(x=>x.p);
  const plan = planRoute(A.myPos, near);
  A.route = { plan, i:0, startedAt:now() };
  drawRoute(); showNextRouteCard();
  const total = plan.reduce((a,x)=>a+x.leg,0);
  toast(`${plan.length} doors · ${fmtDist(total)} walking · ${plan.filter(x=>x.due).length} callbacks first`);
}
function drawRoute(){
  if (A.routeLayer){ A.map.removeLayer(A.routeLayer); A.routeLayer=null; }
  if (!A.route) return;
  const pts = [A.myPos].concat(A.route.plan.slice(A.route.i).map(x=>[x.p.lat,x.p.lng]));
  A.routeLayer = L.polyline(pts, { color:'#1e8cff', weight:3, opacity:.55, dashArray:'6 8', interactive:false }).addTo(A.map);
}

  const x = A.route.plan[A.route.i]; const p=x.p;

  $('#nextS').textContent = (x.due?'Callback due · ':'') + fmtDist(haversine(A.myPos,[p.lat,p.lng])) + ' · ' + p.installer + ' · ' + (TIERS[p.tier]||TIERS.none).short;
}

/* Shrink a camera photo on the phone before it goes anywhere: long edge ≤ maxPx, JPEG. ~120–200 KB per door photo. */
function compressImage(file, maxPx=1280, quality=0.72){
  return new Promise((resolve, reject) => {
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload = () => { try { const sc=Math.min(1, maxPx/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL('image/jpeg', quality)); } catch(e){ reject(e); } finally { URL.revokeObjectURL(url); } };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src=url;
  });
}

function periodRange(period){ const t0=startOfDay(now()); if (period==='today') return [t0, t0+DAY]; if (period==='week'){ const d=new Date(t0); const dow=(d.getDay()+6)%7; return [t0-dow*DAY, t0+DAY]; } return [t0-29*DAY, t0+DAY]; }
function metrics(knocks, props){
  const m = { knocks:0, contacts:0, followups:0, callbacks:0, appts:0, signed:0, byHour:Array(24).fill(0), contactByHour:Array(24).fill(0), days:new Set() };
  // previous outcome on each door, from the full history (not just the period)
  const prev = {}; const all = A.knocks.slice().sort((a,b)=>a.created_at-b.created_at);
  const prevOf = {}; for (const k of all){ prevOf[k.id] = prev[k.property_id] || null; prev[k.property_id] = k.status; }
  const sorted = knocks.slice().sort((a,b)=>a.created_at-b.created_at);
  const FOLLOW = { callback:1, interested:1, appointment:1 };
  for (const k of sorted){
    m.knocks++; m.days.add(dayKey(k.created_at)); const h=new Date(k.created_at).getHours(); m.byHour[h]++;
    const c = S[k.status] && S[k.status].contact; if (c){ m.contacts++; m.contactByHour[h]++; }
    if (FOLLOW[prevOf[k.id]]) m.followups++;
    if (k.status==='callback') m.callbacks++;
    if (k.status==='appointment') m.appts++;
    if (k.status==='signed') m.signed++;
  }
  m.dayCount = Math.max(1, m.days.size);
  return m;
}
const doorKnocks = ks => ks.filter(k => (k.source||'door')==='door');   // portal-sourced rows (GHL outcomes) are not doors
const hourOf = t => { const d=new Date(t); return d.getHours()+d.getMinutes()/60; };
const EARLY_CUT = 10.5, EVENING_CUT = 16;
const fmtClock = h => { if (h==null||!isFinite(h)) return '—'; const hh=Math.floor(h), mm=Math.round((h-hh)*60); return `${hh%12||12}:${String(mm).padStart(2,'0')} ${hh<12?'am':'pm'}`; };

/* One row per day a rep worked: volume, outcomes, start/end, hours, time-of-day mix */
function dayRows(knocksForUser){
  const prev = {}; const all = A.knocks.slice().sort((a,b)=>a.created_at-b.created_at); const prevOf = {};
  for (const k of all){ prevOf[k.id] = prev[k.property_id] || null; prev[k.property_id] = k.status; }
  const FOLLOW = { callback:1, interested:1, appointment:1 };
  const byDay = {};
  for (const k of doorKnocks(knocksForUser)){
    const d = dayKey(k.created_at); const r = byDay[d] ||= { day:d, t0:startOfDay(k.created_at), doors:0, contacts:0, callbacks:0, appts:0, signed:0, followups:0, early:0, mid:0, evening:0, first:null, last:null };
    r.doors++; const h = hourOf(k.created_at);
    if (S[k.status] && S[k.status].contact) r.contacts++;
    if (k.status==='callback') r.callbacks++; if (k.status==='appointment') r.appts++; if (k.status==='signed') r.signed++;
    if (FOLLOW[prevOf[k.id]]) r.followups++;
    if (h < EARLY_CUT) r.early++; else if (h < EVENING_CUT) r.mid++; else r.evening++;
    r.first = r.first==null ? h : Math.min(r.first, h); r.last = r.last==null ? h : Math.max(r.last, h);
    (r.ts ||= []).push(k.created_at);
  }
  // closes from appointments held that day (portal rows) count on the day they happened
  for (const k of knocksForUser){ if ((k.source||'door')!=='door' && k.status==='signed'){ const d=dayKey(k.created_at); const r=byDay[d] ||= { day:d, t0:startOfDay(k.created_at), doors:0, contacts:0, callbacks:0, appts:0, signed:0, followups:0, early:0, mid:0, evening:0, first:null, last:null }; r.signed++; } }
  return Object.values(byDay).map(r => Object.assign(r, { hours: r.ts ? activeHours(r.ts.map(t=>({created_at:t}))) : 0, span: r.first==null ? 0 : r.last - r.first })).sort((a,b)=>b.t0-a.t0);
}
/* Period summary for one rep, with the drivers the gap engine compares */
function repSummary(uid, period){
  const [t0,t1] = periodRange(period);
  const ks = A.knocks.filter(k => k.user_id===uid && k.created_at>=t0 && k.created_at<t1);
  const rows = dayRows(ks);
  const sum = f => rows.reduce((a,r)=>a+r[f],0);
  const days = rows.filter(r=>r.doors>0).length || 0;
  const doors=sum('doors'), contacts=sum('contacts'), appts=sum('appts'), signed=sum('signed'), followups=sum('followups'), hours=sum('hours'), early=sum('early'), evening=sum('evening');
  const starts = rows.filter(r=>r.first!=null).map(r=>r.first);
  const evK = doorKnocks(ks).filter(k=>hourOf(k.created_at)>=EVENING_CUT), dayK = doorKnocks(ks).filter(k=>hourOf(k.created_at)<EVENING_CUT);
  const rate = (arr) => arr.length ? arr.filter(k=>S[k.status]&&S[k.status].contact).length/arr.length : 0;
  const myAppts = A.appts.filter(a => a.user_id===uid && a.at>=t0 && a.at<t1 && a.at<now());
  const held = myAppts.filter(a=>a.status==='held').length, noShow = myAppts.filter(a=>a.status==='no_show').length;
  const overdue = A.props.filter(p => p.status==='callback' && p.last_knock_by===uid && p.callback_at && p.callback_at < now()).length;
  // appointment rate on follow-up knocks specifically (the lever behind "follow-ups per day")
  const prevS = {}; let fuK=0, fuA=0; for (const k of A.knocks.slice().sort((x,y)=>x.created_at-y.created_at)){ const pv=prevS[k.property_id]; if (k.user_id===uid && k.created_at>=t0 && k.created_at<t1 && (k.source||'door')==='door' && (pv==='callback'||pv==='interested'||pv==='appointment')){ fuK++; if (k.status==='appointment') fuA++; } prevS[k.property_id]=k.status; }
  return { uid, name:userName(uid), rows, days, doors, contacts, appts, signed, followups, hours, early, evening, fuApptRate: fuK?fuA/fuK:null,
    doorsPerDay: days?doors/days:0, hoursPerDay: days?hours/days:0, doorsPerHour: hours?doors/hours:0,
    avgStart: starts.length ? starts.reduce((a,b)=>a+b,0)/starts.length : null,
    earlyShare: doors?early/doors:0, eveningShare: doors?evening/doors:0,
    contactRate: doors?contacts/doors:0, apptRate: contacts?appts/contacts:0, closeRate: appts?signed/appts:0,
    eveningContactRate: rate(evK), dayContactRate: rate(dayK),
    followupsPerDay: days?followups/days:0, overdue, held, noShow, showRate: (held+noShow)?held/(held+noShow):null };
}
/* Why does B get more appointments than A? Ranked drivers, each with an estimated appointment impact over the period. */
function explainGap(a, b){
  if (!a.days || !b.days) return { reasons:[], same:[], gap:0 };
  const aAppts = a.appts, bAppts = b.appts; const gap = bAppts - aAppts;
  const cr = a.contactRate || b.contactRate || 0.35, ar = a.apptRate || b.apptRate || 0.1;
  const drv = [];
  drv.push({ k:'days', label:'Days on the doors', a:a.days, b:b.days, fa:a.days+' days', fb:b.days+' days', impact:(b.days-a.days)*a.doorsPerDay*cr*ar, fix:`Work ${b.days-a.days} more day${b.days-a.days===1?'':'s'} in the period` });
  drv.push({ k:'hours', label:'Hours per day', a:a.hoursPerDay, b:b.hoursPerDay, fa:a.hoursPerDay.toFixed(1)+' h', fb:b.hoursPerDay.toFixed(1)+' h', impact:(b.hoursPerDay-a.hoursPerDay)*a.days*(a.doorsPerHour||b.doorsPerHour)*cr*ar, fix: a.avgStart!=null&&b.avgStart!=null&&a.avgStart>b.avgStart+0.4 ? `Start at ${fmtClock(b.avgStart)} instead of ${fmtClock(a.avgStart)}` : `Add ${(b.hoursPerDay-a.hoursPerDay).toFixed(1)} h a day` });
  drv.push({ k:'pace', label:'Doors per hour', a:a.doorsPerHour, b:b.doorsPerHour, fa:a.doorsPerHour.toFixed(1), fb:b.doorsPerHour.toFixed(1), impact:(b.doorsPerHour-a.doorsPerHour)*a.hours*cr*ar, fix:'Less time per door: log it and move. Save the talk for the ones who answer.' });
  const evLift = (b.eveningShare-a.eveningShare) * a.doors * ((a.eveningContactRate||b.eveningContactRate) - (a.dayContactRate||b.dayContactRate)) * ar;
  drv.push({ k:'evening', label:'Doors after 4 pm', a:a.eveningShare, b:b.eveningShare, fa:Math.round(a.eveningShare*100)+'%', fb:Math.round(b.eveningShare*100)+'%', impact:evLift, fix:`Move ${Math.round((b.eveningShare-a.eveningShare)*a.doorsPerDay)} doors a day to after 4 pm — answer rate is ${Math.round((a.eveningContactRate||b.eveningContactRate)*100)}% then vs ${Math.round((a.dayContactRate||b.dayContactRate)*100)}% midday` });
  drv.push({ k:'contact', label:'Answer rate', a:a.contactRate, b:b.contactRate, fa:Math.round(a.contactRate*100)+'%', fb:Math.round(b.contactRate*100)+'%', impact:a.doors*(b.contactRate-a.contactRate)*ar, fix:'Same hours, fewer answers: check the territory and knock-wait time (12 seconds, two knocks)' });
  drv.push({ k:'pitch', label:'Appointment rate', a:a.apptRate, b:b.apptRate, fa:Math.round(a.apptRate*100)+'% of talks', fb:Math.round(b.apptRate*100)+'% of talks', impact:a.contacts*(b.apptRate-a.apptRate), fix:`Ride along with ${b.name}. The pitch is the gap, not the schedule.` });
  drv.push({ k:'followups', label:'Follow-ups per day', a:a.followupsPerDay, b:b.followupsPerDay, fa:a.followupsPerDay.toFixed(1), fb:b.followupsPerDay.toFixed(1), impact:(b.followupsPerDay-a.followupsPerDay)*a.days*(a.fuApptRate??b.fuApptRate??0.2), fix:`${a.overdue} callback${a.overdue===1?'':'s'} overdue right now. Follow-ups book at 3x the rate of fresh doors.` });
  const reasons = drv.filter(d => d.impact > 0.3).sort((x,y)=>y.impact-x.impact).slice(0,3);
  const same = drv.filter(d => d.impact <= 0.3 && d.impact >= -0.3).map(d=>d.label);
  const better = drv.filter(d => d.impact < -0.3).map(d=>d.label);
  return { reasons, same, better, gap, a, b };
}
function topRep(period){ const reps=A.users.filter(u=>u.role==='rep'); return reps.map(u=>repSummary(u.id, period)).filter(s=>s.days>0).sort((x,y)=>y.appts-x.appts||y.contacts-x.contacts)[0] || null; }
function mondayOf(t){ const d=new Date(startOfDay(t)); const dow=(d.getDay()+6)%7; return d.getTime()-dow*DAY; }
function insights(perRep, team, period){
  const out=[];
  const f=followItems();
  if (f.overdue.length) out.push({ k:'bad', ic:'!', t:`${f.overdue.length} callback${f.overdue.length===1?'':'s'} overdue`, s:'Promised times that already passed. Those are the warmest doors on the map.' });
  for (const r of perRep){
    if (r.m.knocks>=25 && r.m.contacts/r.m.knocks < 0.22) out.push({ k:'warn', ic:'H', t:`${r.u.name}: ${pct(r.m.contacts,r.m.knocks)} contact rate on ${r.m.knocks} doors`, s:'Team average is '+pct(team.contacts,team.knocks)+'. Check the hours being worked — nobody is home before 3.' });
    if (r.m.contacts>=12 && r.m.appts/r.m.contacts < 0.06) out.push({ k:'warn', ic:'A', t:`${r.u.name}: ${r.m.contacts} contacts, ${r.m.appts} appt${r.m.appts===1?'':'s'}`, s:'Talking to people, not booking. Ride along or run the door brief with them.' });
    if (r.m.appts>=3 && r.m.appts/r.m.contacts > 0.26) out.push({ k:'good', ic:'★', t:`${r.u.name} is booking ${pct(r.m.appts,r.m.contacts)} of contacts`, s:'Record their pitch. That is the training video.' });
  }
  const best = team.byHour.map((n,h)=>({h, n, c:team.contactByHour[h], r:n?team.contactByHour[h]/n:0})).filter(x=>x.n>=15).sort((a,b)=>b.r-a.r)[0];
  if (best) out.push({ k:'info', ic:'⏱', t:`Best hour: ${fmtHour(best.h)} · ${pct(best.c,best.n)} answer`, s:'Stack the schedule around it. Mornings are for callbacks and texts.' });
  for (const t of A.terrs){
    const ps=A.props.filter(p=>p.territory_id===t.id); if (!ps.length) continue;
    const covered=ps.filter(p=>p.status!=='unknocked').length; const left=ps.filter(isKnockable).length;
    if (covered/ps.length>0.85 && left<10) out.push({ k:'info', ic:'▦', t:`${t.name} is ${pct(covered,ps.length)} covered`, s:`${left} knockable doors left. Draw the next territory or import the next list.` });
    if (!(t.assigned_user_ids||[]).length && left>20) out.push({ k:'warn', ic:'▦', t:`${t.name} has nobody assigned`, s:`${left} knockable doors sitting idle.` });
  }
  const stale = A.positions.filter(p=>p.user_id!==A.me.id && now()-p.updated_at>CONFIG.staleRepMs && now()-p.updated_at<4*3600000);
  if (stale.length && period==='today') out.push({ k:'warn', ic:'◉', t:`${stale.map(p=>userName(p.user_id)).join(', ')} offline ${fmtRel(stale[0].updated_at)}`, s:'Last position older than 3 minutes during field hours.' });
  return out.slice(0,6);
}

function renderBoard(perRep){
